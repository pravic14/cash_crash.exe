<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>cash_crash.exe — Login</title><style>
:root{--header:78px;--task:54px;--pink:#f71887;--purple:#6e28b5;--paper:#fff5fc}*{box-sizing:border-box}body{margin:0;overflow:hidden;font:15px Verdana,sans-serif;color:#280035;background:radial-gradient(#fff 0 2px,transparent 3px) 0 0/28px 28px,linear-gradient(135deg,#ffc3e1,#c9aaff,#ff8fc9)}.site-header,.taskbar{position:fixed;z-index:100;width:100%;color:#fff}.site-header{top:0;height:var(--header);padding:10px 24px;border-bottom:3px ridge #fff;background:linear-gradient(90deg,var(--purple),var(--pink),var(--purple))}.brand{font:bold italic clamp(25px,4vw,39px) Georgia,serif;text-shadow:2px 2px #4e1266}.brand small{display:block;font:10px Verdana;letter-spacing:2px}.nav{position:absolute;right:20px;top:29px}.nav a{margin-left:14px;color:#fff;font-weight:bold}.desktop{position:relative;height:100vh}.window{position:absolute;width:min(440px,calc(100vw - 28px));border:3px solid #260038;box-shadow:8px 8px #7131a7;background:var(--paper)}.bar{display:flex;justify-content:space-between;padding:8px;color:#fff;font-weight:bold;cursor:grab;user-select:none;background:linear-gradient(90deg,var(--pink),var(--purple))}.control{width:23px;height:20px;margin-left:3px;border:2px outset #fff;color:#250033;background:#ffc5e2;font-weight:bold;cursor:pointer}form{padding:20px}label{display:block;margin:12px 0 4px;font-weight:bold}input{width:100%;padding:9px;border:2px inset #fff;font:inherit}.submit{width:100%;margin-top:18px;padding:10px;border:3px outset #ffe3f2;color:#fff;font-weight:bold;background:linear-gradient(#ff74ba,#8e32bb);cursor:pointer}.error{min-height:20px;color:#a0003c;font-size:13px}a{color:#57229b;font-weight:bold}.taskbar{bottom:0;height:var(--task);padding:9px 12px;border-top:3px ridge #fff;background:linear-gradient(90deg,#53237d,#ba3e96,#ff75bd)}.taskbar button{padding:6px 10px;border:2px outset #fff;color:#fff;background:#7536a8;cursor:pointer}@media(max-width:600px){.site-header{height:100px}.nav{top:59px;right:12px}}
</style></head><body><header class="site-header"><div class="brand">cash_crash.exe <small>SECURE PAYMENT CONSOLE</small></div><nav class="nav"><a href="./index.html">Home</a><a href="./signup.html">Sign up</a></nav></header><main class="desktop" id="desktop"></main><footer class="taskbar"><button id="launch">🔒 Member login</button> <span>● Same-origin secure session</span></footer>
<template id="card"><section class="window"><div class="bar"><span>🔒 Member Login</span><span><button class="control" data-close aria-label="Minimise">—</button><button class="control" data-close aria-label="Close">×</button></span></div><form novalidate><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="submit">Log in →</button><p class="error" role="alert"></p><p>New here? <a href="./signup.html">Create an account</a></p></form></section></template><script>
const desktop=document.querySelector('#desktop'),tpl=document.querySelector('#card');let n=0;
function bound(w,x,y){const keep=62;return{x:Math.max(-(w.offsetWidth-keep),Math.min(innerWidth-keep,x)),y:Math.max(-28,Math.min(innerHeight-28,y))}}
function spawn(){const w=tpl.content.firstElementChild.cloneNode(true),i=n++;desktop.append(w);let p=bound(w,innerWidth/2-w.offsetWidth/2+(i%5)*25,innerHeight/2-w.offsetHeight/2+(i%5)*20);w.style.left=p.x+'px';w.style.top=p.y+'px';let drag,bar=w.querySelector('.bar');bar.onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX-w.offsetLeft,y:e.clientY-w.offsetTop};bar.setPointerCapture(e.pointerId);w.style.zIndex=10+i};bar.onpointermove=e=>{if(!drag)return;p=bound(w,e.clientX-drag.x,e.clientY-drag.y);w.style.left=p.x+'px';w.style.top=p.y+'px'};bar.onpointerup=bar.onpointercancel=()=>drag=null;w.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>w.remove());w.querySelector('form').onsubmit=async e=>{e.preventDefault();const out=w.querySelector('.error');out.textContent='';const data=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:data.email,password:data.password})}).catch(()=>null);if(!r){out.textContent='Security service unavailable. Open http://127.0.0.1:8001/login';return}const body=await r.json().catch(()=>null);if(!r.ok){const detail=body&&body.detail;out.textContent=(typeof detail==='string'?detail:'')||(body?'Email or password is wrong.':'This page has no account database. Open http://127.0.0.1:8001/login');return}sessionStorage.setItem('cashcrash_account',body.account_id);sessionStorage.setItem('cashcrash_name',body.display_name);location.assign('./app.html')};w.querySelector('.error').textContent='Demo account: margaret@cashcrash.test / margaret-demo'}
document.querySelector('#launch').onclick=spawn;spawn();
</script></body></html>
